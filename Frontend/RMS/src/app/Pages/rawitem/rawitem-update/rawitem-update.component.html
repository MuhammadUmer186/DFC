<div class="dfc-page">
  <div class="dfc-form-card">
    <h2><i class="pi pi-pencil" style="color: var(--dfc-amber-600); margin-right: 8px;"></i>Edit Raw Item</h2>

    <form (ngSubmit)="update()">
      <div class="dfc-field">
        <label>Item Name</label>
        <input class="dfc-input" type="text" [formControl]="itemName">
      </div>

      <div class="dfc-field">
        <label>Unit</label>
        <input class="dfc-input" type="text" [formControl]="unit">
      </div>

      <button type="submit" class="dfc-btn dfc-btn-primary">
        <i class="pi pi-check"></i> Update
      </button>
    </form>
  </div>
</div>

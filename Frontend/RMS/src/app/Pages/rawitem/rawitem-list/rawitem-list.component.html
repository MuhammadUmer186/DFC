<div class="dfc-page">

  <div class="dfc-page-header">
    <div class="dfc-page-header-text">
      <h2 class="dfc-page-title"><i class="pi pi-inbox"></i> Raw Items</h2>
      <p class="dfc-page-subtitle">Ingredients and supplies used across your menu</p>
    </div>
    <div class="dfc-page-actions">
      <button class="dfc-btn dfc-btn-primary" routerLink="/rawitem-create">
        <i class="pi pi-plus"></i> Add Raw Item
      </button>
    </div>
  </div>

  @if (rawItems.length === 0) {
    <div class="dfc-empty">
      <i class="pi pi-inbox"></i>
      <span>No raw items found</span>
    </div>
  } @else {
    <div class="dfc-table-wrap">
      <table class="dfc-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Unit</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          @for (r of rawItems; track r) {
            <tr>
              <td>{{ r.itemName }}</td>
              <td>{{ r.unit }}</td>
              <td class="actions">
                <button class="dfc-btn dfc-btn-ghost dfc-btn-sm" (click)="edit(r)"><i class="pi pi-pencil"></i> Edit</button>
                <button class="dfc-btn dfc-btn-danger dfc-btn-sm" (click)="delete(r.id)"><i class="pi pi-trash"></i> Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }

</div>

<div class="dfc-page">
  <div class="dfc-form-card dfc-form-card-wide">
    <h2><i class="pi pi-file-plus" style="color: var(--dfc-amber-600); margin-right: 8px;"></i>Create Purchase Order</h2>

    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="dfc-form-grid">
        <div class="dfc-field">
          <label>Bill No</label>
          <input class="dfc-input" type="text" formControlName="billNo">
        </div>

        <div class="dfc-field">
          <label>Vendor</label>
          <select formControlName="vendorId">
            <option [ngValue]="null">-- Select Vendor --</option>
            @for (v of vendors(); track v) {
              <option [ngValue]="v.id">{{v.name}}</option>
            }
          </select>
        </div>
      </div>

      <h3 class="dfc-section-title" style="margin-top: 8px;">Items</h3>

      <div formArrayName="items" class="item-rows">
        @for (row of items.controls; track row; let i = $index) {
          <div [formGroupName]="i" class="item-row">
            <select formControlName="rawItemId" class="item-row-select">
              <option [ngValue]="null">-- Select Raw Item --</option>
              @for (r of rawItems(); track r) {
                <option [ngValue]="r.id">{{r.name}}</option>
              }
            </select>
            <input type="number" class="dfc-input" placeholder="Quantity" formControlName="quantity">
            <input type="number" class="dfc-input" placeholder="Unit Price" formControlName="unitPrice">
            @if (items.length > 1) {
              <button type="button" class="dfc-btn dfc-btn-danger dfc-btn-sm" (click)="removeItem(i)"><i class="pi pi-times"></i></button>
            }
          </div>
        }
      </div>

      <div class="dfc-page-actions" style="margin-top: 12px;">
        <button type="button" class="dfc-btn dfc-btn-ghost" (click)="addItem()"><i class="pi pi-plus"></i> Add Row</button>
        <button type="submit" class="dfc-btn dfc-btn-primary"><i class="pi pi-check"></i> Save Purchase Order</button>
      </div>
    </form>
  </div>
</div>

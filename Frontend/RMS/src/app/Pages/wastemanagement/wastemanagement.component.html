<div class="dfc-page">
  <div class="dfc-form-card dfc-form-card-wide">
    <h2><i class="pi pi-trash" style="color: var(--dfc-danger); margin-right: 8px;"></i>Waste Management</h2>

    <form [formGroup]="wasteForm" (ngSubmit)="submitWaste()">

      <div class="dfc-field" style="max-width: 360px;">
        <label>Waste Reason</label>
        <input class="dfc-input" type="text" formControlName="reason" placeholder="Enter reason like Burnt / Expired">
      </div>

      <h3 class="dfc-section-title" style="margin-top: 8px;">Waste Items</h3>

      <div formArrayName="items" class="item-rows">
        @for (item of items.controls; track item; let i = $index) {
          <div [formGroupName]="i" class="item-row-2col">
            <select formControlName="rawItemId" class="item-row-select">
              <option value="">-- Select Item --</option>
              @for (r of rawItems(); track r) {
                <option [value]="r.id">{{ r.name }} ({{ r.unit }})</option>
              }
            </select>
            <input class="dfc-input" type="number" formControlName="quantity">
            @if (items.length > 1) {
              <button type="button" class="dfc-btn dfc-btn-danger dfc-btn-sm" (click)="removeItem(i)"><i class="pi pi-times"></i></button>
            }
          </div>
        }
      </div>

      <div class="dfc-page-actions" style="margin-top: 12px;">
        <button type="button" class="dfc-btn dfc-btn-ghost" (click)="addWasteItem()"><i class="pi pi-plus"></i> Add Item</button>
        <button type="submit" class="dfc-btn dfc-btn-primary" [disabled]="submitting">
          <i class="pi pi-check"></i> {{ submitting ? 'Saving...' : 'Submit Waste' }}
        </button>
      </div>

    </form>
  </div>
</div>

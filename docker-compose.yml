services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - mssql-data:/var/opt/mssql
      # Phase 14/16: BACKUP DATABASE writes here (path is server-side, on this container).
      - mssql-backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  # Offline-first / cloud-sync — Phase 14. One-shot controlled migrator: waits for
  # SQL, takes the exclusive migration app-lock, (optionally) backs up, applies
  # pending migrations once, records the schema version, exits 0. The API is gated
  # on it completing successfully.
  migrator:
    build:
      context: ./Backend
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=RestaurantDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Deployment__NodeRole: ${DEPLOYMENT_NODE_ROLE:-Cloud}
      Deployment__NodeId: ${DEPLOYMENT_NODE_ID:-}
      Migrator__BackupBeforeMigrate: ${MIGRATOR_BACKUP_BEFORE_MIGRATE:-true}
      # Server-side path on the sqlserver container (BACKUP DATABASE ... TO DISK runs there).
      Migrator__BackupPath: ${MIGRATOR_BACKUP_PATH:-/var/opt/mssql/backup}
      Migrator__SqlWaitSeconds: "180"
    volumes:
      - backend-keys:/app/keys
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  backend:
    build:
      context: ./Backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=RestaurantDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      # Phase 14: never auto-migrate on API start in production; fail fast if the
      # schema is behind (the migrator service is the only writer of schema).
      Migrator__AutoMigrate: "false"
      Migrator__RequireUpToDate: "true"
      AppSettings__Issuer: ${JWT_ISSUER:-DFC-RMS}
      AppSettings__Audience: ${JWT_AUDIENCE:-DFC-RMS-Clients}
      AppSettings__Token: ${JWT_TOKEN}
      SuperAdmin__UserName: ${SUPERADMIN_USERNAME}
      SuperAdmin__Password: ${SUPERADMIN_PASSWORD}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      AiFeatures__ForecastingEnabled: ${AI_FORECASTING_ENABLED:-true}
      AiFeatures__InventoryRecommendationsEnabled: ${AI_INVENTORY_ENABLED:-true}
      AiFeatures__InsightsAssistantEnabled: ${AI_ASSISTANT_ENABLED:-true}
      AiFeatures__UseMockProvider: ${AI_USE_MOCK_PROVIDER:-false}
      # Offline-first / cloud-sync — Phase 1 (node & branch identity).
      Deployment__NodeRole: ${DEPLOYMENT_NODE_ROLE:-Cloud}
      Deployment__NodeId: ${DEPLOYMENT_NODE_ID:-}
      Deployment__BranchId: ${DEPLOYMENT_BRANCH_ID:-}
      Deployment__BranchName: ${DEPLOYMENT_BRANCH_NAME:-Main Branch}
      Deployment__BranchCode: ${DEPLOYMENT_BRANCH_CODE:-}
      Deployment__NodeDisplayName: ${DEPLOYMENT_NODE_DISPLAY_NAME:-}
      Deployment__CloudBaseUrl: ${DEPLOYMENT_CLOUD_BASE_URL:-}
      Deployment__EdgeBaseUrl: ${DEPLOYMENT_EDGE_BASE_URL:-}
      Deployment__NodeIdFilePath: /app/keys/node-id.txt
      # Phase 5 — transactional sync engine.
      Sync__HmacSecret: ${SYNC_HMAC_SECRET:-}
      Sync__WorkerEnabled: ${SYNC_WORKER_ENABLED:-}
      Sync__IntervalSeconds: ${SYNC_INTERVAL_SECONDS:-10}
    volumes:
      - backend-uploads:/app/wwwroot/uploads
      - backend-keys:/app/keys
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  rms-frontend:
    build:
      context: ./Frontend/RMS
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  customer-frontend:
    build:
      context: ./Frontend/CustomerOrderingWeb
    ports:
      - "4300:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mssql-data:
  backend-uploads:
  # Persists the generated per-node identity (and, from Phase 8, JWT signing keys)
  # across container recreations.
  backend-keys:
  # Phase 14/16: pre-migration backup checkpoints (and, with Phase 16, scheduled backups).
  mssql-backups:

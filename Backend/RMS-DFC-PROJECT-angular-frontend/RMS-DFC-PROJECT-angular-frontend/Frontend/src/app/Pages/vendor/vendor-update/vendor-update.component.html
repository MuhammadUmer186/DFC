<h2>Edit Vendor</h2>

<form (ngSubmit)="update()">

  <label>Name</label>
  <input type="text" [formControl]="name">

  <label>Phone</label>
  <input type="text" [formControl]="phone">

  <label>Address</label>
  <input type="text" [formControl]="address">

  <button type="submit">Update</button>
</form>

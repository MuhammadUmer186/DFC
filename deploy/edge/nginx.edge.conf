# Edge gateway — the ONLY externally reachable service on the restaurant LAN.
# Terminates TLS, serves the RMS PWA, and reverse-proxies the API / uploads /
# SignalR hub to the backend container on the internal network. Phase 15.

server {
    listen 80;
    server_name _;
    # Redirect to HTTPS. Stations must use https:// for the PWA + WSS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name edge.dfc.lan;                      # match your LAN DNS name

    ssl_certificate     /etc/nginx/certs/edge.crt; # mounted (internal CA or real cert)
    ssl_certificate_key /etc/nginx/certs/edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;                    # RMS SPA (built into this image)
    index index.html;
    client_max_body_size 20M;

    # Runtime config for the PWA (Phase 9) — mounted, not baked in.
    location = /runtime-config.json {
        default_type application/json;
        alias /usr/share/nginx/html/runtime-config.json;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        expires 7d;
    }

    location /hubs/ {
        proxy_pass http://backend:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /health/ {
        proxy_pass http://backend:8080/health/;
        access_log off;
    }

    # Optional on-LAN customer ordering site (QR at the tables).
    location /order/ {
        proxy_pass http://customer-frontend:80/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
